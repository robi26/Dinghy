name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Go core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Submodules are cloned at the same depth as the parent. Without full
          # history sushitrain has no tags, `git describe --tags` degrades to a
          # bare commit hash, and Syncthing refuses to start on it.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Test
        working-directory: core
        run: go test -tags noassets t-shaped.nl/sushitrain/v2/src ./...

  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # splits.abi is a no-op on AGP 9, so each ABI is a separate build.
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Submodules are cloned at the same depth as the parent. Without full
          # history sushitrain has no tags, `git describe --tags` degrades to a
          # bare commit hash, and Syncthing refuses to start on it.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: android-actions/setup-android@v4
        with:
          # The action's default package list is "tools platform-tools", and
          # the obsolete "tools" package is no longer in Google's repository:
          # sdkmanager exits 1 with "Failed to find package 'tools'" and takes
          # the whole job with it. Nothing here needs it -- the NDK is
          # installed by name below.
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager --install "ndk;30.0.16248370"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -Pabi=${{ matrix.abi }}

      - name: Assemble
        run: ./gradlew :app:assembleDebug -Pabi=${{ matrix.abi }}

      - uses: actions/upload-artifact@v7
        with:
          name: dinghy-debug-${{ matrix.abi }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

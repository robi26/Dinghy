name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Go core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Test
        working-directory: core
        run: go test -tags noassets t-shaped.nl/sushitrain/v2/src ./...

  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # splits.abi is a no-op on AGP 9, so each ABI is a separate build.
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew :app:assembleDebug -Pabi=${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-debug-${{ matrix.abi }}
          path: app/build/outputs/apk/debug/*.apk

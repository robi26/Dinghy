name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Signed APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Submodules are cloned at the same depth as the parent. Without full
          # history sushitrain has no tags, `git describe --tags` degrades to a
          # bare commit hash, and Syncthing refuses to start on it.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: android-actions/setup-android@v4
        with:
          # The action's default package list is "tools platform-tools", and
          # the obsolete "tools" package is no longer in Google's repository:
          # sdkmanager exits 1 with "Failed to find package 'tools'" and takes
          # the whole job with it. Nothing here needs it -- the NDK is
          # installed by name below.
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager --install "ndk;30.0.16248370"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DINGHY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DINGHY_KEYSTORE_BASE64 is not set; a release must be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          DINGHY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          DINGHY_KEYSTORE_PASSWORD: ${{ secrets.DINGHY_KEYSTORE_PASSWORD }}
          DINGHY_KEY_ALIAS: ${{ secrets.DINGHY_KEY_ALIAS }}
          DINGHY_KEY_PASSWORD: ${{ secrets.DINGHY_KEY_PASSWORD }}
        run: |
          # The tag names the release: the APK filenames, the versionName the app
          # reports and the Obtainium manifest all have to agree, so they are all
          # derived from it rather than from a constant in the build file. A
          # workflow_dispatch run has no tag and falls back to the build default.
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
            echo "Building version $VERSION_NAME from tag $TAG"
            export VERSION_NAME
          fi
          ./gradlew :app:dist -Pabi=${{ matrix.abi }}

      - name: Verify it is actually signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --verbose dist/*.apk | tee /tmp/verify.txt
          grep -q "v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dinghy-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: build
    # A workflow_dispatch run builds and verifies but has no tag to publish to.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build Obtainium manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo '{'
            echo "  \"version\": \"${VERSION}\","
            echo "  \"releaseUrl\": \"https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}\","
            echo '  "apks": ['
            first=1
            for f in dist/*.apk; do
              name=$(basename "$f")
              # Strip the known prefix rather than pattern-match the tail:
              # ABI names contain dashes, so a greedy match yields "v8a".
              abi="${name#dinghy-${VERSION}-}"
              abi="${abi%.apk}"
              if [ "$abi" = "${name%.apk}" ]; then
                echo "::error::$name is not named for version $VERSION" >&2
                exit 1
              fi
              [ $first -eq 0 ] && echo ','
              first=0
              printf '    {"abi": "%s", "name": "%s", "url": "%s/%s", "sha256": "%s"}' \
                "$abi" "$name" "$BASE" "$name" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo '  ]'
            echo '}'
          } > dist/latest-release.json
          cat dist/latest-release.json

      - name: Checksums
        run: cd dist && sha256sum *.apk > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/latest-release.json
            dist/SHA256SUMS
          generate_release_notes: true

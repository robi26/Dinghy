name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Signed APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIDECAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIDECAR_KEYSTORE_BASE64 is not set; a release must be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          SIDECAR_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIDECAR_KEYSTORE_PASSWORD: ${{ secrets.SIDECAR_KEYSTORE_PASSWORD }}
          SIDECAR_KEY_ALIAS: ${{ secrets.SIDECAR_KEY_ALIAS }}
          SIDECAR_KEY_PASSWORD: ${{ secrets.SIDECAR_KEY_PASSWORD }}
        run: ./gradlew :app:dist -Pabi=${{ matrix.abi }}

      - name: Verify it is actually signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --verbose dist/*.apk | tee /tmp/verify.txt
          grep -q "v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.abi }}
          path: dist/*.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build Obtainium manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo '{'
            echo "  \"version\": \"${VERSION}\","
            echo "  \"releaseUrl\": \"https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}\","
            echo '  "apks": ['
            first=1
            for f in dist/*.apk; do
              name=$(basename "$f")
              # Strip the known prefix rather than pattern-match the tail:
              # ABI names contain dashes, so a greedy match yields "v8a".
              abi="${name#sidecar-${VERSION}-}"
              abi="${abi%.apk}"
              [ $first -eq 0 ] && echo ','
              first=0
              printf '    {"abi": "%s", "name": "%s", "url": "%s/%s", "sha256": "%s"}' \
                "$abi" "$name" "$BASE" "$name" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo '  ]'
            echo '}'
          } > dist/latest-release.json
          cat dist/latest-release.json

      - name: Checksums
        run: cd dist && sha256sum *.apk > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/latest-release.json
            dist/SHA256SUMS
          generate_release_notes: true
